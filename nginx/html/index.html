<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicketPass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf6;--ink:#161a3a;--mut:#5d6488;--card:#fff;--line:#d3d9ea;--acc:#3b3bff;--acc2:#ffd23f;--ok:#0f8a5f;--bad:#c4264a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:820px;margin:0 auto;padding:20px 16px 8px}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--acc)}
#who{font-size:14px;color:var(--mut)}
#who button{margin-left:8px}
nav{max-width:820px;margin:0 auto;padding:0 16px;display:flex;gap:6px;overflow-x:auto}
nav div{flex:1;min-width:64px;padding:6px 0;border-top:3px solid var(--line);font-size:13px;color:var(--mut)}
nav div.on{border-color:var(--acc);color:var(--ink);font-weight:600}
nav div.done{border-color:var(--ink)}
main{max-width:820px;margin:16px auto 60px;padding:0 16px}
.stub{background:var(--card);border-radius:14px;padding:24px;position:relative;box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(22,26,58,.35)}
.stub::before,.stub::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.stub::before{left:-11px}.stub::after{right:-11px}
h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.01em}
p.sub{margin:0 0 18px;color:var(--mut)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:11px 12px;font:inherit;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--acc2);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--acc);color:#fff}
button.ghost{background:transparent;color:var(--acc);padding:4px 8px}
button.alt{background:var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{background:var(--bg);color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.ev{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px dashed var(--line)}
.ev:first-of-type{border-top:0}
.ev b{display:block;font-size:18px}
.ev small{color:var(--mut)}
.big{font-size:84px;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--acc)}
.chip{display:inline-block;background:var(--acc2);color:var(--ink);padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600}
.sec{margin:14px 0 6px;font-weight:600}
.seats{display:flex;flex-wrap:wrap;gap:6px}
.seat{width:52px;padding:8px 0;font-size:13px;text-align:center;background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.seat.locked{background:var(--acc2);border-color:var(--acc2)}
.seat.mine{background:var(--acc);border-color:var(--acc);color:#fff}
.seat.sold{background:var(--line);border-color:var(--line);color:var(--mut);text-decoration:line-through}
.qr{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--ink);color:#fff;border-radius:10px;padding:14px;margin:14px 0}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width 1s linear}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:92%;padding:12px 18px;border-radius:10px;color:#fff;background:var(--bad);display:none;z-index:9}
#toast.ok{background:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){.big{font-size:64px}.stub{padding:18px}}
</style>
</head>
<body>
<header><h1>Ticket<span>Pass</span></h1><div id="who"></div></header>
<nav id="nav"></nav>
<main><section class="stub" id="view" aria-live="polite"></section></main>
<div id="toast" role="alert"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
const API='/api/v1';
const STEPS=['Masuk','Event','Antrean','NIK','Kursi','Pesan','Tiket'];
const S={step:0,mode:'login',locks:[],seats:[]};
let timers=[];
const $=q=>document.querySelector(q);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const MSG={SALE_NOT_OPEN:'Penjualan belum dibuka. Coba lagi nanti.',NIK_QUOTA_EXCEEDED:'Kuota tiket untuk NIK ini sudah habis (maksimal 2).',INVALID_NIK:'NIK harus 16 digit angka.',UNAUTHORIZED:'Sesi habis. Silakan masuk lagi.'};

function toast(m,ok){const t=$('#toast');t.textContent=m;t.className=ok?'ok':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4500)}
function clearT(){timers.forEach(clearInterval);timers=[]}
function every(fn,ms){timers.push(setInterval(fn,ms))}

async function api(path,o={}){
  const h={'Content-Type':'application/json',...(o.h||{})};
  if(S.token)h.Authorization='Bearer '+S.token;
  const r=await fetch(API+path,{method:o.m||'GET',headers:h,body:o.b?JSON.stringify(o.b):undefined});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(MSG[d&&d.code]||(d&&d.message)||('Gagal ('+r.status+')'));e.status=r.status;e.code=d&&d.code;throw e}
  return d&&d.data!==undefined&&!Array.isArray(d)?d.data:d;
}
async function run(fn){try{await fn()}catch(e){if(e.status===401&&S.token){logout();}toast(e.message)}}

function logout(){clearT();Object.assign(S,{token:null,user:null,step:0,locks:[],seats:[]});render()}
function go(n){clearT();S.step=n;render()}

function chrome(){
  $('#nav').innerHTML=STEPS.map((s,i)=>`<div class="${i===S.step?'on':i<S.step?'done':''}">${s}</div>`).join('');
  $('#who').innerHTML=S.token?`${esc(S.user&&S.user.fullName||S.email||'Pengguna')}<button class="ghost" id="out">Keluar</button>`:'';
  const o=$('#out');if(o)o.onclick=logout;
}
function render(){chrome();const v=$('#view');[vLogin,vEvents,vQueue,vNik,vSeats,vOrder,vTicket][S.step](v)}

/* 0 Masuk */
function vLogin(v){
  const reg=S.mode==='register';
  v.innerHTML=`<h2>${reg?'Buat akun':'Masuk ke akunmu'}</h2><p class="sub">Masuk dulu untuk ikut antrean tiket konser.</p>
  <div class="tabs"><button class="${reg?'':'on'}" data-m="login">Masuk</button><button class="${reg?'on':''}" data-m="register">Daftar</button></div>
  <form id="f">${reg?'<label for="n">Nama lengkap</label><input id="n" required autocomplete="name">':''}
  <label for="e">Email</label><input id="e" type="email" required autocomplete="email">
  <label for="p">Kata sandi</label><input id="p" type="password" minlength="8" required autocomplete="${reg?'new-password':'current-password'}">
  <div class="row"><button>${reg?'Daftar dan masuk':'Masuk'}</button></div></form>`;
  v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;render()});
  $('#f').onsubmit=ev=>{ev.preventDefault();run(async()=>{
    const email=$('#e').value.trim(),password=$('#p').value;
    if(reg){await api('/auth/register',{m:'POST',b:{email,password,fullName:$('#n').value.trim()}})}
    const t=await api('/auth/login',{m:'POST',b:{email,password}});
    S.token=t.accessToken;S.email=email;
    try{S.user=await api('/auth/me')}catch(e){}
    go(1)})};
}

/* 1 Event */
async function vEvents(v){
  v.innerHTML='<h2>Pilih konser</h2><p class="sub">Memuat daftar event...</p>';
  await run(async()=>{
    const list=await api('/events');S.events=list;
    v.innerHTML=`<h2>Pilih konser</h2><p class="sub">Klik Masuk antrean untuk mendapat nomor urut.</p>`+
    (list.length?list.map((e,i)=>`<div class="ev"><div><b>${esc(e.name)}</b><small>${esc(e.venue)} - ${new Date(e.startsAt).toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'})}</small></div><button data-i="${i}">Masuk antrean</button></div>`).join(''):'<p>Belum ada event.</p>');
    v.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>run(async()=>{
      S.event=list[b.dataset.i];
      const q=await api(`/events/${S.event.id}/queue/join`,{m:'POST'});
      S.qt=q.queueToken;S.pos=q.position;S.wait=null;go(2)}));
  });
}

/* 2 Antrean */
function vQueue(v){
  const draw=()=>{v.innerHTML=`<h2>Kamu di ruang tunggu</h2><p class="sub">${esc(S.event.name)}. Jangan tutup halaman ini.</p>
    <div class="big">${S.pos??'-'}</div><p>posisi antreanmu${S.wait!=null?` <span class="chip">sekitar ${S.wait} detik lagi</span>`:''}</p>
    <div class="row"><button class="ghost" id="back">Batal dan kembali</button></div>`;$('#back').onclick=()=>go(1)};
  draw();
  const poll=()=>run(async()=>{
    try{
      const d=await api(`/events/${S.event.id}/queue/status?queueToken=${encodeURIComponent(S.qt)}`);
      S.pos=d.position;S.wait=d.estimatedWaitSeconds;
      if(d.admitted&&d.checkoutToken){S.ct=d.checkoutToken;toast('Giliranmu! Lanjut verifikasi NIK.',true);go(3);return}
      draw();
    }catch(e){if(e.status===410||e.status===404){toast('Antrean berakhir. Masuk antrean lagi.');go(1);return}throw e}
  });
  poll();every(poll,3000);
}

/* checkout timer chip */
function startCk(){
  const upd=()=>api(`/events/${S.event.id}/queue/checkout`,{h:{'X-Checkout-Token':S.ct}}).then(d=>{
    const c=$('#ck');if(c)c.textContent=d.valid?`Sisa waktu ${Math.floor(d.expiresInSeconds/60)}m ${d.expiresInSeconds%60}d`:'Waktu habis';
  }).catch(()=>{const c=$('#ck');if(c)c.textContent='Waktu habis'});
  upd();every(upd,10000);
}
const ckChip='<span class="chip" id="ck">...</span>';

/* 3 NIK */
function vNik(v){
  v.innerHTML=`<h2>Verifikasi NIK</h2><p class="sub">Satu NIK maksimal 2 tiket. NIK disimpan terenkripsi. ${ckChip}</p>
  <form id="f"><label for="nik">NIK (16 digit)</label><input id="nik" inputmode="numeric" pattern="[0-9]{16}" maxlength="16" required>
  <div class="row"><button>Verifikasi</button></div></form>`;
  startCk();
  $('#f').onsubmit=ev=>{ev.preventDefault();run(async()=>{
    const d=await api('/identity/nik/verify',{m:'POST',h:{'X-Checkout-Token':S.ct},b:{eventId:S.event.id,nik:$('#nik').value}});
    S.quota=Math.max(1,Math.min(2,d.remainingQuota));toast('NIK valid. Sisa kuota '+d.remainingQuota+' tiket.',true);go(4)})};
}

/* 4 Kursi */
async function vSeats(v){
  v.innerHTML='<h2>Pilih kursi</h2><p class="sub">Memuat denah...</p>';
  await run(async()=>{
    S.seats=await api(`/events/${S.event.id}/seats`,{h:{'X-Checkout-Token':S.ct}});S.locks=[];draw();startCk();
  });
  function draw(){
    const by={};S.seats.forEach(s=>(by[s.section]=by[s.section]||[]).push(s));
    const mine=new Set(S.locks.map(l=>l.seatId));
    v.innerHTML=`<h2>Pilih kursi</h2><p class="sub">Maksimal ${S.quota} kursi. Kursi dikunci 10 menit. ${ckChip}</p>`+
    Object.keys(by).map(sec=>`<div class="sec">${esc(sec)}</div><div class="seats">`+by[sec].map(s=>{
      const m=mine.has(s.id),cls=m?'mine':s.status==='available'?'':s.status;
      return `<button class="seat ${cls}" data-id="${esc(s.id)}" ${!m&&s.status!=='available'?'disabled':''} title="${rp(s.price)}">${esc(s.row)}${esc(s.number)}</button>`}).join('')+'</div>').join('')+
    `<div class="row"><button id="next" ${S.locks.length?'':'disabled'}>Lanjut ke pemesanan (${S.locks.length})</button></div>`;
    v.querySelectorAll('.seat').forEach(b=>b.onclick=()=>run(async()=>{
      const id=b.dataset.id;
      if(mine.has(id))return;
      if(S.locks.length>=S.quota){toast('Kuotamu '+S.quota+' kursi.');return}
      const l=await api(`/events/${S.event.id}/seats/${encodeURIComponent(id)}/lock`,{m:'POST',h:{'X-Checkout-Token':S.ct}});
      S.locks.push({lockId:l.lockId,seatId:id});draw()}));
    $('#next').onclick=()=>go(5);
    const c=$('#ck');if(c&&S.lastCk)c.textContent=S.lastCk;
  }
}

/* 5 Pesan */
function vOrder(v){
  const rows=S.locks.map(l=>{const s=S.seats.find(x=>x.id===l.seatId)||{};return {s,l}});
  const total=rows.reduce((a,r)=>a+Number(r.s.price||0),0);
  v.innerHTML=`<h2>Konfirmasi pesanan</h2><p class="sub">${esc(S.event.name)} ${ckChip}</p>`+
  rows.map(r=>`<div class="ev"><div><b>${esc(r.s.section)} ${esc(r.s.row)}${esc(r.s.number)}</b></div><span>${rp(r.s.price)}</span></div>`).join('')+
  `<div class="ev"><b>Total</b><b>${rp(total)}</b></div><div class="row"><button id="buy">Bayar pesanan</button><button class="ghost" id="back">Ubah kursi</button></div>`;
  startCk();
  $('#back').onclick=()=>go(4);
  $('#buy').onclick=()=>run(async()=>{
    S.order=await api(`/events/${S.event.id}/orders`,{m:'POST',h:{'X-Checkout-Token':S.ct},b:{eventId:S.event.id,seatIds:S.locks.map(l=>l.seatId)}});
    S.order.id=S.order.orderId;const p=await api(`/orders/${S.order.id}/pay`,{m:'POST'});S.order.status=p.status;toast('Pesanan dibayar.',true);go(6)});
}

/* 6 Tiket */
function qrSvg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:6,margin:0})}catch(e){return '<p>QR gagal dibuat</p>'}}
function vTicket(v){
  const ids=S.order.ticketIds||[];let cur=0;
  v.innerHTML=`<h2>Tiketmu</h2><p class="sub">Pesanan ${esc(S.order.id)} - ${esc(S.order.status)} - ${rp(S.order.totalAmount)}</p>
  <div class="row" id="tabs"></div><div id="qr"><p class="sub">Memuat QR...</p></div>
  <div class="row"><button class="alt" id="again">Pesan lagi</button></div>`;
  $('#again').onclick=()=>go(1);
  function tabs(){$('#tabs').innerHTML=ids.length>1?ids.map((t,i)=>`<button class="${i===cur?'':'alt'}" data-i="${i}">Tiket ${i+1}</button>`).join(''):'';
    $('#tabs').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;tabs();load()})}
  let left=0,total=30;
  const load=()=>run(async()=>{
    if(!ids[cur]){$('#qr').innerHTML='<p>Tiket belum tersedia.</p>';return}
    const q=await api(`/tickets/${ids[cur]}/qr`);total=q.refreshInSeconds||30;left=total;paint(q)});
  function paint(q){$('#qr').innerHTML=`<div class="qr" style="background:#fff;padding:14px;border-radius:12px;display:inline-block;line-height:0;color:#000">${qrSvg(q.payload)}</div><div class="bar"><i id="b" style="width:${left/total*100}%"></i></div><p class="sub" id="t">QR berganti dalam ${left} detik</p>`;
    clearT();every(()=>{left--;if(left<=0){load();return}const b=$('#b'),t=$('#t');if(b)b.style.width=left/total*100+'%';if(t)t.textContent='QR berganti dalam '+left+' detik'},1000)}
  tabs();load();
}
render();
</script>
</body>
</html>
